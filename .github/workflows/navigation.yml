name: Navegação autorizada

on:
  workflow_dispatch:
    inputs:
      confirm_free_limit:
        description: Confirmo que gastos adicionais do GitHub Actions estão bloqueados
        default: false
        type: boolean
      task:
        description: ID da tarefa cadastrada no repositório
        required: true
        default: direct-smoke
        type: string
      confirm_browserless_free:
        description: Confirmo que o plano Browserless é Free
        default: false
        type: boolean
      allow_browserless:
        description: Permitir Browserless nesta execução
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: navegacao-cloud
  cancel-in-progress: false

jobs:
  navigate:
    name: Executar tarefa
    if: >-
      github.event.repository.private &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.confirm_free_limit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NAV_TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar Chromium somente para tarefas de navegador
        run: |
          if node --input-type=module -e "import { tasks } from './src/tasks.mjs'; process.exit(tasks.get(process.env.NAV_TASK)?.kind === 'browser' ? 0 : 1)"; then
            chrome_path=$(command -v google-chrome || true)
            if [ -n "$chrome_path" ]; then
              echo "CHROMIUM_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
            fi
          fi
      - name: Executar e registrar resultado
        run: node src/cli.mjs
        env:
          NAV_ALLOW_BROWSERLESS: ${{ inputs.allow_browserless }}
          BROWSERLESS_ENABLED: ${{ inputs.allow_browserless }}
          BROWSERLESS_FREE_CONFIRMED: ${{ inputs.confirm_browserless_free }}
          BROWSERLESS_REGION: ${{ vars.BROWSERLESS_REGION }}
          BROWSERLESS_TOKEN: ${{ inputs.allow_browserless && inputs.confirm_browserless_free && secrets.BROWSERLESS_TOKEN || '' }}
